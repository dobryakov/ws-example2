services:
  backend:
    build:
      context: ..
      dockerfile: compose/backend.Dockerfile
    container_name: ws-demo-backend
    ports:
      - "${BACKEND_PORT:-9001}:${BACKEND_PORT:-9001}"
    environment:
      - NODE_ENV=production
      - HOST=${HOST:-example.local}
      - BACKEND_PORT=${BACKEND_PORT:-9001}
    env_file:
      - ../.env
    volumes:
      - ../backend:/app/backend:ro
    command: npm start
    restart: unless-stopped
    networks:
      - ws-demo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${BACKEND_PORT:-9001}/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: compose/frontend.Dockerfile
    container_name: ws-demo-frontend
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    environment:
      - BACKEND_HOST=${HOST:-example.local}
      - BACKEND_PORT=${BACKEND_PORT:-9001}
    env_file:
      - ../.env
    volumes:
      - ../frontend/public:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - ws-demo-network
    depends_on:
      - backend
    entrypoint: ["/bin/sh", "-c", "envsubst '$$BACKEND_HOST $$BACKEND_PORT' < /usr/share/nginx/html/sw.js > /tmp/sw.js && mv /tmp/sw.js /usr/share/nginx/html/sw.js && nginx -g 'daemon off;'"]

networks:
  ws-demo-network:
    driver: bridge

