services:
  backend:
    build:
      context: ..
      dockerfile: compose/backend.Dockerfile
    container_name: ws-demo-backend-test
    environment:
      - NODE_ENV=test
      - HOST=localhost
      - FRONTEND_PORT=${FRONTEND_PORT:-9000}
      - BACKEND_PORT=${BACKEND_PORT:-9001}
    env_file:
      - ../.env
    networks:
      - ws-demo-test-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${BACKEND_PORT:-9001}/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: compose/frontend.Dockerfile
    container_name: ws-demo-frontend-test
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=${BACKEND_PORT:-9001}
    env_file:
      - ../.env
    networks:
      - ws-demo-test-network
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "envsubst '$$BACKEND_HOST $$BACKEND_PORT' < /usr/share/nginx/html/sw.js > /tmp/sw.js && mv /tmp/sw.js /usr/share/nginx/html/sw.js && envsubst '$$BACKEND_PORT' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    volumes:
      - ../compose/nginx.test.conf.template:/etc/nginx/templates/default.conf.template:ro

  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile.test
    container_name: ws-demo-tests
    environment:
      - HOST=localhost
      - BACKEND_HOST=backend
      - BACKEND_PORT=${BACKEND_PORT:-9001}
      - FRONTEND_PORT=${FRONTEND_PORT:-9000}
    env_file:
      - ../.env
    network_mode: service:frontend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

networks:
  ws-demo-test-network:
    driver: bridge

