services:
  backend:
    build:
      context: ..
      dockerfile: compose/backend.Dockerfile
    container_name: ws-demo-backend-test
    environment:
      - NODE_ENV=test
      - HOST=${HOST:-example.local}
      - BACKEND_PORT=${BACKEND_PORT:-9001}
    env_file:
      - ../.env
    networks:
      - ws-demo-test-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${BACKEND_PORT:-9001}/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: compose/frontend.Dockerfile
    container_name: ws-demo-frontend-test
    environment:
      - BACKEND_HOST=${HOST:-example.local}
      - BACKEND_PORT=${BACKEND_PORT:-9001}
    env_file:
      - ../.env
    networks:
      - ws-demo-test-network
    depends_on:
      backend:
        condition: service_healthy

  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile.test
    container_name: ws-demo-tests
    environment:
      - HOST=${HOST:-example.local}
      - BACKEND_PORT=${BACKEND_PORT:-9001}
      - FRONTEND_PORT=${FRONTEND_PORT:-9000}
    env_file:
      - ../.env
    networks:
      - ws-demo-test-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ../tests:/app/tests:ro
      - ../backend:/app/backend:ro
      - ../frontend:/app/frontend:ro

networks:
  ws-demo-test-network:
    driver: bridge

